        environment: {
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
            NODE_VERSION: "22"
            OS_VERSION: "ol9"
            EXPECTED_SIZE_MB_BUILD_IMAGE: 399
            EXPECTED_SIZE_MB_RUNTIME_IMAGE: 362
            EXPECTED_SIZE_MB_CODE_ONLY_FN_RUNTIME_IMAGE: 263
            BUILD_ARCH: X86
        }
        # faas-pipelines compartment in functionsdevopspipelines
        compartmentOcid: "ocid1.compartment.oc1..aaaaaaaailr3poourrwfby6lbjbww3kw4qed63mdhwxi5q4dkc65lcfugaiq"
        # Do NOT delete the secrets block even if it is empty since Build Service need that to generate RP token in the instance
        secrets: [
        ]
        command: "make -f internal/Makefile check_image_sizes"
        artifacts: [
            "**"
        ]
    }
    {
        name: checkImageSizesArmArch_node22
