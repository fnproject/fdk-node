name: fdk-node
phoneBookId: functions
team: Functions
description: Node FDK
runnerTag: latest
version: 0 # Set by set_fdk_version and the setup_*_image steps, needs to be present here anyway
releaseBranches: ["master", "pull-requests"]
triggerOnCommitBranches: ["pull-requests", "*"]
buildImageVersion: ""
runtimeImageVersion: ""
fdkVersion: ""
codeOnlyFnRuntimeImageVersion: ""

authCompartmentOcid: ocid1.compartment.oc1..aaaaaaaajnvcjjwfciaef2iaofrv5oq5yupxaivpzy7qrheify3lh42po27q
pipelineTriggerConfig: {
    "branchFilter": {
        "master": ["ocid1.devopsbuildpipeline.oc1.phx.amaaaaaaepf6idia4p7uas4hdpnp3ys5rcioarhlyjhovvvge4yzk64kpkwq"]
        "pull-requests": ["ocid1.devopsbuildpipeline.oc1.phx.aaaaaaaawhdnwfwku5ahwqawphsnh7h5gha6lnpdzbfpmtp45cqu5espevkq"] # TODO switch the pipeline ID to match with master

        # Note - To trigger integration tests for any non master / non PR branch, replace the <"branch_name"> placeholder below with branch name and uncomment below line.
        # "<branch_name>": ["ocid1.devopsbuildpipeline.oc1.phx.amaaaaaaepf6idia4p7uas4hdpnp3ys5rcioarhlyjhovvvge4yzk64kpkwq"]
    }
}

variables: {
    HTTP_PROXY: "http://www-proxy-hqdc.us.oracle.com:80"
    HTTPS_PROXY: "http://www-proxy-hqdc.us.oracle.com:80"
    NO_PROXY: "localhost,127.0.0.1,.us.oracle.com,.oraclecorp.com"
    RELEASE: "false"
}

exportVariables {
    FDK_VERSION = "${set_fdk_version.fdk_version}"
}

steps: [
    ### Build FDK ###
    {
        name: set_fdk_version
        type: make
        environment: {
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_fdk_version", args: "-f internal/Makefile" }
        ]
        dotEnvFilePath: exportVariables.env
        artifacts: [
            "**"
        ]
    }
    {
        name: unit_test_node22
        type: node
        dependsOn: set_fdk_version
        nodeVersion: "22.19.0"
        runnerImage: build-runner-node-ol9
        commands: [
            { command: "npm", args: "install" }
            { command: "npm", args: "run test" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: unit_test_node24
        type: node
        dependsOn: set_fdk_version
        nodeVersion: "24.10.0"
        runnerImage: build-runner-node-ol9
        commands: [
            { command: "npm", args: "install" }
            { command: "npm", args: "run test" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: build_fdk
        type: node
        dependsOn: [unit_test_node22, unit_test_node24]
        nodeVersion: "22.19.0"
        runnerImage: build-runner-node-ol9
        commands: [
            { command: "npm", args: "install" }
            { command: "npm", args: "pack" }
        ]
        artifacts: [
            "**"
        ]
    }
    # npm only allows a proper version number in package.json so that is left as the main fdk version
    # We need a unique artifact name to upload to artifactory though so this adds the build number and branch
    # suffix to the filename
    {
        name: fix_fdk_filename
        type: make
        dependsOn: build_fdk
        environment: {
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "fix_fdk_filename", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: publish_fdk
        type: publishgeneric
        dependsOn: fix_fdk_filename
        repository: faas-release-generic-local
        filePathsToPublish: [
            { localFile: "fnproject-fdk-"${version}".tgz", targetDir: "fdk-node" }
        ]
    }

    ### Node 22 images ###
    {
        name: setup_node22_build_image
        type: make
        dependsOn: set_fdk_version
        environment: {
            NODE_VERSION: "22"
            FDK_VERSION: ${version}
            VERSION_SUFFIX: "dev"
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_image_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: build_image_node22
        type: dockerizer
        dependsOn: setup_node22_build_image,
        dockerFile: "./internal/images/build-stage/22/Dockerfile"
        dockerBuildPwd: "./internal/images/build-stage/22"
        environment: {
            DOCKER_BUILDKIT: "1"
        }
        dockerBuildArgs: {
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
        }
        images : [
            {
                platform: "linux/x86_64"
            },
            {
                platform: "linux/arm64"
            }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: publish_build_image_node22
        type: publishdocker
        dependsOn: build_image_node22
        imageName: "fdk-node"
        repository: odo-docker-signed-local
        artifacts: [
            "**"
        ]
    }
    # The individual build chains for each image can't be merged if the value of the version variable differs,
    # setting it back to the FDK version because that's the only bit that changes per build
    {
        name: fixup_version_build22
        type: make
        dependsOn: publish_build_image_node22
        environment: {
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_fdk_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: setup_node22_runtime_image
        type: make
        dependsOn: set_fdk_version
        environment: {
            NODE_VERSION: "22"
            FDK_VERSION: ${version}
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_image_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: runtime_image_node22
        type: dockerizer
        dependsOn: setup_node22_runtime_image,
        dockerFile: "./internal/images/runtime/22/Dockerfile"
        dockerBuildPwd: "./internal/images/runtime/22"
        environment: {
            DOCKER_BUILDKIT: "1"
        }
        dockerBuildArgs: {
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
        }
        images : [
            {
                platform: "linux/x86_64"
            },
            {
                platform: "linux/arm64"
            }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: publish_runtime_image_node22
        type: publishdocker
        dependsOn: runtime_image_node22
        imageName: "fdk-node"
        repository: odo-docker-signed-local
        artifacts: [
            "**"
        ]
    }
    # The individual build chains for each image can't be merged if the value of the version vaiable differs,
    # setting it back to the FDK version because that's the only bit that changes per build
    {
        name: fixup_version_runtime22
        type: make
        dependsOn: publish_runtime_image_node22
        environment: {
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_fdk_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: setup_node22_code_only_fn_runtime_image
        type: make
        dependsOn: [set_fdk_version, fix_fdk_filename]
        environment: {
            NODE_VERSION: "22"
            FDK_VERSION: ${version}
            RELEASE: ${RELEASE}
            VERSION_SUFFIX: "code-only-fn"
            OS_VERSION: "ol9"
        }
        makeCommands: [
            { target: "set_image_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    # node22 copy fdk package into docker directory
    {
      name: setup_node22_code_only_fn_fdk
      type: make
      dependsOn: [set_fdk_version, fix_fdk_filename]
      environment: {
        NODE_VERSION: "22"
        RELEASE: ${RELEASE}
      }
      makeCommands: [
        { target: "setup_code_only_runtime_fdk", args: "-f internal/Makefile" }
      ]
      artifacts: [
        "**"
      ]
    },
    {
        name: code_only_fn_runtime_image_node22
        type: dockerizer
        dependsOn: [setup_node22_code_only_fn_runtime_image, setup_node22_code_only_fn_fdk]
        dockerFile: "./internal/images/code-only-fn-runtime/22/Dockerfile"
        dockerBuildPwd: "./internal/images/code-only-fn-runtime/22"
        environment: {
            DOCKER_BUILDKIT: "1"
        }
        dockerBuildArgs: {
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            NO_PROXY: ${NO_PROXY}
            FDK_VERSION: ${fdkVersion}
        }
        images : [
            {
                platform: "linux/x86_64"
            },
            {
                platform: "linux/arm64"
            }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: publish_code_only_fn_runtime_image_node22
        type: publishdocker
        dependsOn: code_only_fn_runtime_image_node22
        imageName: "fdk-node"
        repository: odo-docker-signed-local
        artifacts: [
            "**"
        ]
    }
    # The individual build chains for each image can't be merged if the value of the version vaiable differs,
    # setting it back to the FDK version because that's the only bit that changes per build
    {
        name: fixup_version_code_only_fn_runtime22
        type: make
        dependsOn: publish_code_only_fn_runtime_image_node22
        environment: {
            RELEASE: ${RELEASE}
        }
        makeCommands: [
            { target: "set_fdk_version", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: setup_test_image_build22
        type: make
        dependsOn: [fix_fdk_filename, fixup_version_build22, fixup_version_runtime22, fixup_version_code_only_fn_runtime22]
        environment: {
            NODE_VERSION: "22"
            RELEASE: ${RELEASE}
            OS_VERSION: "ol9"
        }
        makeCommands: [
            { target: "setup_test_image_build", args: "-f internal/Makefile" }
        ]
        artifacts: [
            "**"
        ]
    }
    {
        name: checkImageSizesX86Arch_node22
        type: Compute
        runnerImage: "bld-default-ol9"
        runnerTag: "260109-1.0.1"
        dependsOn: [setup_test_image_build22]
        compute: {
            os: Linux
            type: VM
            arch: x86
